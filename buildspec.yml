version: 0.2

# AWS CodeBuild project "judge0" (prod account 405612465938, ap-south-1).
# Its GitHub webhook starts a build on every push to master. The build pushes
# NewtonDockerfile's production target to ECR as judge0:<commit-sha>, the tag
# kubernetes-cluster-infra pins, and moves judge0:latest. A manual build of a
# branch (start-build --source-version <branch>) pushes its SHA tag only.
#
# The project supplies AWS_ACCOUNT_ID, AWS_DEFAULT_REGION and IMAGE_REPO_NAME.
# The layer cache is judge0:buildcache in the same ECR repo.

env:
  shell: bash

phases:
  pre_build:
    commands:
      - REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
      - IMAGE="$REGISTRY/$IMAGE_REPO_NAME"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
      # Never rebuild a SHA that is already in ECR: tags in this repo are
      # mutable, and a rebuild (apt, gems) is not byte-identical to the image a
      # deployment may already pin. A retried build is then a no-op.
      - EXISTS=""
      - if docker buildx imagetools inspect "$IMAGE:$CODEBUILD_RESOLVED_SOURCE_VERSION" >/dev/null 2>&1; then EXISTS=1; echo "$IMAGE:$CODEBUILD_RESOLVED_SOURCE_VERSION already exists; not rebuilding"; fi
      # Exporting the cache to a registry needs the docker-container driver.
      - docker buildx create --name judge0 --driver docker-container --use
      - LATEST_TAG=""
      - if [ "${CODEBUILD_WEBHOOK_TRIGGER:-}" = branch/master ]; then LATEST_TAG="--tag $IMAGE:latest"; fi
  build:
    commands:
      # --provenance=false pushes one manifest instead of an index plus
      # attestation manifests.
      - >-
        test -n "$EXISTS" ||
        docker buildx build
        --file NewtonDockerfile --target production --platform linux/amd64
        --provenance=false
        --cache-from "type=registry,ref=$IMAGE:buildcache"
        --cache-to "type=registry,ref=$IMAGE:buildcache,mode=max"
        --tag "$IMAGE:$CODEBUILD_RESOLVED_SOURCE_VERSION" $LATEST_TAG
        --push .
      - test -n "$EXISTS" || echo "Pushed $IMAGE:$CODEBUILD_RESOLVED_SOURCE_VERSION"
