name: Trigger Staging Build

on:
  workflow_dispatch:

concurrency:
  group: build-staging
  cancel-in-progress: true

jobs:
  build:
    runs-on: monkci-ubuntu-24.04-4
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Resolve image tag
        id: tags
        run: echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: NewtonDockerfile
          target: production
          push: true
          platforms: linux/amd64
          cache-from: type=registry,ref=newtonschool/newton-judge0:buildcache
          cache-to: type=registry,ref=newtonschool/newton-judge0:buildcache,mode=max
          tags: |
            newtonschool/newton-judge0:${{ steps.tags.outputs.sha }}
            newtonschool/newton-judge0:latest

      - name: Summary
        run: |
          echo "Pushed \`newtonschool/newton-judge0:${{ steps.tags.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
